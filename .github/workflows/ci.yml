name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The app targets Windows first (path handling, .cmd shims), so test there.
    runs-on: windows-latest
    env:
      # Typecheck, tests and build don't need the Electron runtime.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
